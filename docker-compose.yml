services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: webgwent
    volumes:
      - webgwent-pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5180:5180"
    environment:
      Jwt__Key: "${JWT_KEY:-WebGwent-Dev-Signing-Key-Change-Me-32chars!}"
      Jwt__Issuer: WebGwent
      Jwt__Audience: WebGwent
      SeedAdmin__Username: "${ADMIN_USER:-admin}"
      SeedAdmin__Password: "${ADMIN_PASSWORD:-admin123}"
      SeedAdmin__DisplayName: Admin
      Cors__Origins__0: "http://localhost:5097"
      Cors__Origins__1: "http://server:5097"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=webgwent;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - webgwent-data:/app/App_Data
    depends_on:
      - db

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5097:5097"
    environment:
      ApiBaseUrl: "http://api:5180"
    depends_on:
      - api

volumes:
  webgwent-data:
  webgwent-pg:
